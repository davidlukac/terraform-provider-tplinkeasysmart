# GoReleaser configuration for the Terraform Registry (HashiCorp scaffolding pattern).
# Produces, per tag: one zip per OS/arch, <name>_<version>_SHA256SUMS, its detached
# GPG signature (.sig) and <name>_<version>_manifest.json, as the Registry requires.
# The module's project name is derived from the repository directory, so this only
# yields terraform-provider-tplinkeasysmart once the provider lives in a repo of that name.
version: 2

project_name: terraform-provider-tplinkeasysmart

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # Needs a GPG key; in CI it is imported by crazy-max/ghaction-import-gpg.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Registry ingestion ignores draft releases.
  draft: false

changelog:
  disable: true # CHANGELOG.md is maintained by hand
