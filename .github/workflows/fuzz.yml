# Longer fuzzing than the seed corpora that `go test` runs on every pull request: every fuzz target for a
# few minutes, weekly and on request. A crash fails the run and the failing input is in the log (and in the
# uploaded testdata/fuzz directories): commit it with the fix. `make fuzz` reproduces it locally.
name: Fuzz

on:
  schedule:
    - cron: "43 3 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fuzz every target
        run: make fuzz SECONDS="${SECONDS_PER_TARGET}"
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
