# CodeQL code scanning, advanced setup (replaces GitHub's "default setup").
#
# Why not the default setup: its Go autobuild is a cold `go build ./...` with no module or
# build cache, about 11 minutes of a 12 minute job. Here the shared setup action restores the
# Go caches and Go is built by an explicit step. Actions and Python need no build.
#
# Conventions: third-party actions are pinned to commit SHAs (the comment names the release).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, as the default setup did, so new queries run against an unchanged main.
    - cron: "17 4 * * 1"

# A newer push to the same PR supersedes the running one; runs on main always finish.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: ./.github/actions/setup
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
