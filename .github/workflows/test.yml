# CI for github.com/davidlukac/terraform-provider-tplinkeasysmart (the provider is the
# repository root). Everything runs against an in-memory fake switch: no hardware.
#
# Conventions:
#   * Third-party actions are pinned to commit SHAs (the comment names the release);
#     Dependabot keeps the SHAs current.
#   * Steps call the Makefile, so a local `make <target>` reproduces CI.
#   * Shared setup lives in .github/actions/setup.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the running one; runs on main always finish.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tfplugindocs needs a Terraform binary to read the provider schema.
      - uses: ./.github/actions/setup
        with:
          terraform: latest
      - name: Build
        run: go build -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Generated docs are up to date
        run: make docs-check
      - name: Documentation examples validate against the schemas
        run: make validate-examples
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  # Go matrix: "go.mod" is the minimum the module declares (the supported floor),
  # "stable" is the newest release and catches toolchain regressions early. Older Go
  # releases are not tested because go.mod forbids them.
  unit:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["go.mod", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ matrix.go }}
          terraform: latest
      # Race detector, whole module, and the coverage policy: every statement
      # covered unless its function says `// coverage: ignore - <reason>`.
      - name: Tests with coverage policy
        run: make cover
      - name: Coverage report
        if: always()
        run: |
          [ -f cover.out ] || exit 0
          go tool cover -html=cover.out -o coverage.html
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
            echo "Per-function detail: download the \`coverage\` artifact (coverage.html)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-go-${{ matrix.go }}
          path: |
            cover.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # Publishes the measured coverage as a shields.io endpoint file (coverage.json) on
  # the `badges` branch, written by CI only, never by hand. The README badge reads
  # it from there. Runs on pushes to main, from the go.mod-version unit run.
  coverage-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-go-go.mod
          path: ${{ runner.temp }}/coverage
      - name: Compute coverage
        run: |
          go run ./tools/coverpolicy badge "$RUNNER_TEMP/coverage/cover.out" . > "$RUNNER_TEMP/coverage.json"
          cat "$RUNNER_TEMP/coverage.json"
      - name: Publish to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A second worktree: the main checkout stays on the commit the job was built from,
          # because the job's post step for ./.github/actions/setup reads that action from it.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges:refs/remotes/origin/badges
            git worktree add --force -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && { echo "coverage unchanged"; exit 0; }
          git commit -m "chore: coverage $(jq -r .message coverage.json)"
          git push origin badges

  # Terraform plan/apply/import/drift/destroy lifecycles on every supported Terraform
  # version. 1.4 is the documented lower bound; the others catch regressions at
  # boundaries (import/moved handling, harness behaviour) without testing every minor.
  acceptance:
    name: Terraform ${{ matrix.terraform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.4.*", "1.6.*", "1.8.*", "1.10.*", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          terraform: ${{ matrix.terraform }}
      - run: make testacc

  # Same lifecycles on OpenTofu. Informational: a Tofu-only quirk must not block
  # merges (continue-on-error). Promote it to required once it has proven stable.
  opentofu:
    name: OpenTofu latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Point the test harness at OpenTofu
        run: |
          {
            echo "TF_ACC_TERRAFORM_PATH=$(command -v tofu)"
            echo "TF_ACC_PROVIDER_NAMESPACE=hashicorp"
            echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org"
          } >> "$GITHUB_ENV"
      - run: make testacc

  # Dry-run of the release build (no signing, no publishing), so a broken
  # .goreleaser.yml is found on the PR, not on release day. All 14 OS/arch targets
  # compile the whole dependency tree from scratch (~7 min on a 2-core runner), so
  # PRs only build the runner's own target (`goreleaser build --single-target`:
  # config and hooks validated, no archives) and pushes to main run the full
  # `release --snapshot` (all targets, archives, checksums).
  release-dry-run:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: ${{ github.event_name == 'pull_request' && 'build --snapshot --clean --single-target' || 'release --snapshot --clean --skip=sign,publish' }}
        env:
          GPG_FINGERPRINT: none
