# The "Merge readiness" check: a pull request whose description has a "Merge readiness" section
# (the pull request template ends with one) is red while a box of that section is unticked, and
# the job output lists the boxes. A description without the section (an outside contributor's,
# Dependabot's, an older pull request's) passes with a message. The rules of the check, and why it
# is stricter than the renderer, are in the documentation of tools/mergereadiness (a copy
# made by hand of the program of the escp-go library, which is its source).
#
# What this file does and does not do:
#   * It is its own workflow and not a job of test.yml because it must run when the description is
#     edited (`edited`), which the default triggers of a pull request do not include.
#   * The job reads the CURRENT description of the pull request through the API, not the one in the
#     event payload: a re-run of an older run would otherwise publish a verdict for a description
#     that has changed since. When the description cannot be read the job is red.
#   * The description is untrusted input: it is written to a file by the step that fetches it and the
#     program reads that file (an environment variable would fail the step, with an opaque error, for a
#     description over about 128 KiB; the program refuses a file over 1 MiB with a message). It is
#     never interpolated into a `run:` text. The token the job has only reads pull requests and the
#     repository, and only the step that fetches the description gets it, so the program (and what a
#     pull request changes in it) runs without it. No secret is used, so a pull request from a fork
#     runs the same job.
#   * One run per pull request: an edit supersedes a run that is queued or running. A re-run of an
#     older run belongs to the same group and can cancel a newer run that is in flight; a canceled
#     run is not a pass, and the newer edit or a re-run of the newest run reports the verdict.
#   * The job runs the pull request's own copy of the program and of this workflow, so a pull
#     request that changes them is judged by the changed version: that is read in the diff, like any
#     change to a workflow. Red blocks a merge only when the check is a required status check, which
#     is a repository setting and not something this file can do.
#   * Go is installed with actions/setup-go directly (pinned, as in .github/actions/setup, which
#     is not used here), without a cache: the program has no dependency but the standard library.
name: Merge readiness

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

# One run per pull request: an edit while the previous run is queued or running supersedes it.
concurrency:
  group: merge-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-readiness:
    name: Merge readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the checkout, which holds the program
      pull-requests: read # the current description of the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The current description, into a file: a failed request is a red job, never a pass.
      - name: Read the current description
        run: |
          gh api "repos/${REPOSITORY}/pulls/${NUMBER}" --jq '.body // ""' > "$RUNNER_TEMP/body.md" \
            || { echo "::error::the pull request description could not be read"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
      - name: Boxes of the merge readiness section are ticked
        run: go run ./tools/mergereadiness -body-file "$RUNNER_TEMP/body.md"
