# Publishes a signed GitHub release (which the Terraform Registry ingests through its
# webhook). Requires the repository secrets GPG_PRIVATE_KEY and GPG_PASSPHRASE and the
# matching public key registered in the Registry.
#
# MANUAL ONLY: pushing a v* tag does NOT release. Push the tag first, then run this
# workflow with the tag as input (gh workflow run release.yml -f tag=vX.Y.Z). To release
# on every tag push instead, add:
#
#   push:
#     tags: ["v*"]
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          awk -v v="${TAG#v}" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "no CHANGELOG section for ${TAG#v}"; exit 1; }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # GoReleaser ignores --release-notes while changelog.disable is set, so the notes
      # (extracted from CHANGELOG.md above) are applied to the release afterwards.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
