name: Set up Go and Terraform
description: Go from go.mod (module and build cache on) and, optionally, a Terraform CLI without the output-swallowing wrapper.
inputs:
  go-version:
    description: Go version to install ("stable", "1.27.x"); empty or "go.mod" uses the version in go.mod.
    default: ""
  terraform:
    description: Terraform version or range to install ("latest", "1.8.*"); empty installs none.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # `cond && '' || x` is broken in expressions ('' is falsy), so the
        # "use go.mod" case is spelled out on both inputs.
        go-version: ${{ inputs.go-version != '' && inputs.go-version != 'go.mod' && inputs.go-version || '' }}
        go-version-file: ${{ (inputs.go-version == '' || inputs.go-version == 'go.mod') && 'go.mod' || '' }}
        cache: true
        # the pinned linter and vulnerability scanner (devtools/go.mod) are built from source and cached too
        cache-dependency-path: |
          go.sum
          devtools/go.sum
    - if: inputs.terraform != ''
      # The lifecycle tests drive a real Terraform CLI. Without one on PATH each
      # test downloads its own and the job times out.
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform }}
        terraform_wrapper: false
