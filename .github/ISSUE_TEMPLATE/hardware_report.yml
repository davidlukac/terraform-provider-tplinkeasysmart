name: Hardware or firmware report
description: Tell us how the provider behaves on another model or firmware
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Switch model and hardware version
      placeholder: TL-SG105E v5
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please start **read-only**: this configuration only logs in and reads, it never writes.

        ```hcl
        provider "tplinkeasysmart" {
          host     = "192.0.2.10"   # your switch
          username = "admin"
          password = var.password
        }

        data "tplinkeasysmart_system_info" "this" {}
        data "tplinkeasysmart_ports" "this" {}

        output "info"  { value = data.tplinkeasysmart_system_info.this }
        output "ports" { value = data.tplinkeasysmart_ports.this }
        ```

        `terraform plan` is enough. Redact hosts, credentials and MAC addresses.
  - type: dropdown
    id: login
    attributes:
      label: Did the login and the read-only data sources work?
      options:
        - Yes, both data sources returned data
        - Login rejected or timed out
        - Login worked, data looked wrong or incomplete
        - Not tried yet
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you ran and what happened
      description: Start with the read-only data sources (`system_info`, `ports`). Redact hosts, credentials and MAC addresses.
    validations:
      required: true
