    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="1280" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="18" fill="url(#grid)"/>

  <!-- headline -->
  <text x="70" y="78" font-size="40" font-weight="700" fill="#f8fafc">terraform-provider-<tspan fill="url(#accent)">tplinkeasysmart</tspan></text>
  <text x="70" y="116" font-size="20" fill="#cbd5e1">Manage TP-Link Easy Smart switches as code. Native UDP protocol, no web scraping.</text>

