version: "2"

run:
  timeout: 5m
  build-tags: []

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - gosec
    - forbidigo
  settings:
    misspell:
      # American English, as the Go standard library and godoc spell it.
      locale: US
    forbidigo:
      # The ESCP library writes nowhere on its own: every message goes through the
      # *slog.Logger the caller passes in (Config.Logger, DiscoverOptions.Logger).
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: the library logs through its slog.Logger (Config.Logger), never to stdout
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: the library logs through its slog.Logger (Config.Logger), not the log package
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        # Weak primitives are the device's own protocol (RC4, 64-bit RSA,
        # math/big) and are documented as such in internal/escp/PROTOCOL.md.
        - G401
        - G501
        - G505
  exclusions:
    rules:
      # forbidigo guards the library only; the provider, the tools and main may print.
      - path: ^(main\.go|tools/|internal/provider/|internal/regression/)
        linters:
          - forbidigo
      # G115 (integer conversion overflow): the protocol is a fixed-width binary
      # format. Conversions are either bit-level masking/shifting by design or
      # operate on values range-checked beforehand (ports 1-32, rates up to
      # 1,000,000 kbps, TLV lengths bounded by the packet buffer).
      - path: internal/escp/
        text: "G115"
        linters:
          - gosec
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - revive
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/davidlukac/terraform-provider-tplinkeasysmart
