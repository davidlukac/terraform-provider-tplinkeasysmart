version: "2"

run:
  timeout: 5m
  build-tags: []

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - gosec
    - forbidigo
    # The stricter set of escp-go (readability, naming, misuse of the language, complexity limits).
    - gocritic
    - predeclared
    - errname
    - nilerr
    - nolintlint
    - gocyclo
    - gocognit
    - nestif
    - unparam
    - prealloc
    - intrange
    - copyloopvar
    - nakedret
    - unconvert
    - wastedassign
    - whitespace
    - recvcheck
    - contextcheck
    - noctx
    - exhaustive
    - perfsprint
    - usestdlibvars
    - forcetypeassert
    - dupword
    - errchkjson
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    misspell:
      # American English, as the Go standard library and godoc spell it.
      locale: US
    forbidigo:
      # The ESCP library writes nowhere on its own: every message goes through the
      # *slog.Logger the caller passes in (Config.Logger, DiscoverOptions.Logger).
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: the library logs through its slog.Logger (Config.Logger), never to stdout
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: the library logs through its slog.Logger (Config.Logger), not the log package
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unexported-return
        - name: redefines-builtin-id
        - name: bare-return
        - name: argument-limit
          arguments: [5]
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      # forbidigo guards the library only; the provider, the tools and main may print.
      - path: ^(main\.go|tools/|internal/provider/|internal/regression/)
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - revive
          - forbidigo
          # Tests are long on purpose (tables, scripted switches) and read top to bottom.
          - gocyclo
          - gocognit
          - nestif
          - unparam
          - prealloc
          - contextcheck
          - noctx
          - perfsprint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/davidlukac/terraform-provider-tplinkeasysmart
